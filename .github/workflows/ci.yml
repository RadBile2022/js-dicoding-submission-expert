name: Continuous Integration

on:
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: developer
          POSTGRES_PASSWORD: supersecretpassword
          POSTGRES_DB: forumapi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U developer -d forumapi_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      HOST: localhost
      PORT: 3000
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: developer
      PGPASSWORD: supersecretpassword
      PGDATABASE: forumapi_test
      ACCESS_TOKEN_KEY: ci-access-token-key
      REFRESH_TOKEN_KEY: ci-refresh-token-key
      ACCESS_TOKEN_AGE: 3000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run test database migrations
        run: npm run migrate:test -- up

      - name: Run all tests
        run: npm test

      - name: Check coverage
        run: npm run test:coverage
